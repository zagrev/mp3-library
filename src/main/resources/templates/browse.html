<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browse Directories</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
<p><a href="/">Back to catalog</a></p>
<h1>Browse Server Directories</h1>

<div th:if="${message}" class="message" th:text="${message}"></div>
<div th:if="${error}" class="error" th:text="${error}"></div>

<form method="get" action="/browse" style="margin-bottom: 0.5rem;">
    <label for="browsePath">Current folder:</label>
    <input id="browsePath" name="browsePath" type="text" size="90" th:value="${browsePath}">
    <button type="submit">Open</button>
</form>
<form method="get" action="/browse" th:if="${browseParentPath != ''}" style="margin-bottom: 0.5rem;">
    <input type="hidden" name="browsePath" th:value="${browseParentPath}">
    <button type="submit">Up One Level</button>
</form>

<form id="scanSelectedForm" method="post" action="/browse/scan-selected" style="margin-bottom: 0.75rem;">
    <input type="hidden" name="browsePath" th:value="${browsePath}">
    <button type="submit">Scan Selected Directories</button>
</form>

<p class="muted">Selected directories: <span id="selectedCount">0</span></p>

<div class="actions">
    <button id="clearSelectionBtn" type="button">Clear Selection</button>
</div>

<div class="table-wrap">
<table>
    <thead>
    <tr>
        <th>Select</th>
        <th>Directory</th>
        <th>Path</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dir : ${browseDirectories}">
        <td><input type="checkbox" data-select-path="true" th:value="${dir.fullPath}"></td>
        <td><a th:href="@{/browse(browsePath=${dir.fullPath})}" th:text="${dir.name}"></a></td>
        <td th:text="${dir.fullPath}"></td>
    </tr>
    </tbody>
</table>
</div>
</main>
<script>
(() => {
    const STORAGE_KEY = "mp3-library-browse-selected";
    const checkboxes = Array.from(document.querySelectorAll("input[data-select-path]"));
    const selectedCountEl = document.getElementById("selectedCount");
    const scanForm = document.getElementById("scanSelectedForm");
    const clearBtn = document.getElementById("clearSelectionBtn");

    const loadSelected = () => {
        try {
            return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
        } catch (error) {
            return new Set();
        }
    };

    const saveSelected = (selected) => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(selected)));
    };

    const selected = loadSelected();

    const render = () => {
        checkboxes.forEach((checkbox) => {
            checkbox.checked = selected.has(checkbox.value);
        });
        if (selectedCountEl) {
            selectedCountEl.textContent = String(selected.size);
        }
    };

    checkboxes.forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
            if (checkbox.checked) {
                selected.add(checkbox.value);
            } else {
                selected.delete(checkbox.value);
            }
            saveSelected(selected);
            render();
        });
    });

    if (clearBtn) {
        clearBtn.addEventListener("click", () => {
            selected.clear();
            saveSelected(selected);
            render();
        });
    }

    if (scanForm) {
        scanForm.addEventListener("submit", () => {
            scanForm.querySelectorAll("input[name='selectedPaths']").forEach((input) => input.remove());
            Array.from(selected).forEach((path) => {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = "selectedPaths";
                input.value = path;
                scanForm.appendChild(input);
            });
        });
    }

    render();
})();
</script>
</body>
</html>
