<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit MP3 Record</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .row { margin-bottom: 0.7rem; }
        input[type="text"] { width: 100%; max-width: 950px; padding: 0.35rem; }
        label { display: block; margin-bottom: 0.2rem; font-weight: bold; }
        .message { padding: 0.5rem; margin-bottom: 1rem; background: #e6ffed; }
        .error { padding: 0.5rem; margin-bottom: 1rem; background: #ffeef0; }
        .actions { display: flex; gap: 1rem; margin-top: 1rem; }
    </style>
</head>
<body>
<p><a href="/">Back to catalog</a></p>
<h1>Edit MP3 Record</h1>

<div th:if="${message}" class="message" th:text="${message}"></div>
<div th:if="${error}" class="error" th:text="${error}"></div>

<form th:action="@{'/mp3/' + ${record.id} + '/update'}" method="post">
    <div class="row">
        <label>Original Path</label>
        <input type="text" th:value="${record.originalPath}" readonly>
    </div>
    <div class="row">
        <label>Current Path (update to move file)</label>
        <input type="text" name="currentPath" th:value="${record.currentPath}">
    </div>
    <div class="row">
        <label>Artist</label>
        <input type="text" name="artist" th:value="${record.artist}">
    </div>
    <div class="row">
        <label>Album</label>
        <input type="text" name="album" th:value="${record.album}">
    </div>
    <div class="row">
        <label>Title</label>
        <input type="text" name="title" th:value="${record.title}">
    </div>
    <div class="row">
        <label>Track</label>
        <input type="text" name="track" th:value="${record.track}">
    </div>
    <div class="row">
        <label>Year</label>
        <input type="text" name="year" th:value="${record.year}">
    </div>
    <div class="row">
        <label>Genre</label>
        <input type="text" name="genre" th:value="${record.genre}">
    </div>
    <div class="row">
        <label>Comment</label>
        <input type="text" name="commentText" th:value="${record.commentText}">
    </div>

    <div class="actions">
        <button type="submit">Save Metadata + Path</button>
    </div>
</form>

<form th:action="@{'/mp3/' + ${record.id} + '/lookup'}" method="post" style="margin-top: 1rem;">
    <button type="submit">Lookup metadata in MusicBrainz</button>
</form>
</body>
</html>
