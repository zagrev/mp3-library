<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MP3 Library</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.4rem; text-align: left; }
        th { background: #f5f5f5; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
        .message { padding: 0.5rem; margin-bottom: 1rem; background: #e6ffed; }
        .error { padding: 0.5rem; margin-bottom: 1rem; background: #ffeef0; }
        .browser { border: 1px solid #ccc; padding: 0.8rem; margin: 1rem 0; background: #fafafa; }
        .browser table { margin-top: 0.6rem; }
        .browser-actions { display: flex; gap: 0.4rem; }
    </style>
</head>
<body>
<h1>MP3 Library</h1>

<div th:if="${message}" class="message" th:text="${message}"></div>
<div th:if="${error}" class="error" th:text="${error}"></div>

<form method="post" action="/scan">
    <label for="directoryPath">Scan server directory:</label>
    <input id="directoryPath" name="directoryPath" type="text" size="90" placeholder="C:\\music\\collection" required>
    <button type="submit">Scan</button>
</form>

<div class="browser">
    <h2>Browse Server Directories</h2>
    <form method="get" action="/" style="margin-bottom: 0.5rem;">
        <label for="browsePath">Current folder:</label>
        <input id="browsePath" name="browsePath" type="text" size="90" th:value="${browsePath}">
        <button type="submit">Open</button>
    </form>
    <form method="get" action="/" th:if="${browseParentPath != ''}" style="margin-bottom: 0.5rem;">
        <input type="hidden" name="browsePath" th:value="${browseParentPath}">
        <button type="submit">Up One Level</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>Directory</th>
            <th>Path</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dir : ${browseDirectories}">
            <td th:text="${dir.name}"></td>
            <td th:text="${dir.fullPath}"></td>
            <td class="browser-actions">
                <form method="get" action="/">
                    <input type="hidden" name="browsePath" th:value="${dir.fullPath}">
                    <button type="submit">Open</button>
                </form>
                <form method="post" action="/scan">
                    <input type="hidden" name="directoryPath" th:value="${dir.fullPath}">
                    <button type="submit">Scan Here</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<h2>Filter</h2>
<form method="get" action="/">
    <div class="grid">
        <input type="text" name="artist" placeholder="Artist" th:value="${artist}">
        <input type="text" name="album" placeholder="Album" th:value="${album}">
        <input type="text" name="title" placeholder="Title" th:value="${title}">
        <input type="text" name="path" placeholder="Path contains" th:value="${path}">
    </div>
    <button type="submit">Apply Filters</button>
</form>

<h2>Catalog</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Artist</th>
        <th>Album</th>
        <th>Title</th>
        <th>Track</th>
        <th>Current Path</th>
        <th>Original Path</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="record : ${records}">
        <td th:text="${record.id}"></td>
        <td th:text="${record.artist}"></td>
        <td th:text="${record.album}"></td>
        <td th:text="${record.title}"></td>
        <td th:text="${record.track}"></td>
        <td th:text="${record.currentPath}"></td>
        <td th:text="${record.originalPath}"></td>
        <td><a th:href="@{'/mp3/' + ${record.id}}">Edit</a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
