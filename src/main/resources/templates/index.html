<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MP3 Library</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
<h1>MP3 Library</h1>

<div th:if="${message}" class="message" th:text="${message}"></div>
<div th:if="${error}" class="error" th:text="${error}"></div>

<div class="actions">
    <a href="/browse">Add New Music</a>
</div>

<h2>Filter</h2>
<form method="get" action="/">
    <div class="grid">
        <input type="text" name="artist" placeholder="Artist" th:value="${artist}">
        <input type="text" name="album" placeholder="Album" th:value="${album}">
        <input type="text" name="title" placeholder="Title" th:value="${title}">
        <input type="text" name="path" placeholder="Path contains" th:value="${path}">
    </div>
    <button type="submit">Apply Filters</button>
</form>

<form method="get" action="/" style="margin: 0.6rem 0;">
    <input type="hidden" name="artist" th:value="${artist}">
    <input type="hidden" name="album" th:value="${album}">
    <input type="hidden" name="title" th:value="${title}">
    <input type="hidden" name="path" th:value="${path}">
    <input type="hidden" name="sort" th:value="${sort}">
    <input type="hidden" name="dir" th:value="${dir}">
    <input type="hidden" name="page" value="0">
    <label for="size">Rows per page:</label>
    <select id="size" name="size" onchange="this.form.submit()">
        <option value="10" th:selected="${size == 10}">10</option>
        <option value="25" th:selected="${size == 25}">25</option>
        <option value="50" th:selected="${size == 50}">50</option>
        <option value="100" th:selected="${size == 100}">100</option>
    </select>
</form>

<h2>Catalog</h2>
<div class="table-wrap">
<table>
    <thead>
    <tr>
        <th><a th:href="@{/(artist=${artist},album=${album},title=${title},path=${path},page=0,size=${size},sort='id',dir=${sort == 'id' and dir == 'asc' ? 'desc' : 'asc'})}">ID <span th:if="${sort == 'id'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
        <th><a th:href="@{/(artist=${artist},album=${album},title=${title},path=${path},page=0,size=${size},sort='artist',dir=${sort == 'artist' and dir == 'asc' ? 'desc' : 'asc'})}">Artist <span th:if="${sort == 'artist'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
        <th><a th:href="@{/(artist=${artist},album=${album},title=${title},path=${path},page=0,size=${size},sort='album',dir=${sort == 'album' and dir == 'asc' ? 'desc' : 'asc'})}">Album <span th:if="${sort == 'album'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
        <th><a th:href="@{/(artist=${artist},album=${album},title=${title},path=${path},page=0,size=${size},sort='title',dir=${sort == 'title' and dir == 'asc' ? 'desc' : 'asc'})}">Title <span th:if="${sort == 'title'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
        <th><a th:href="@{/(artist=${artist},album=${album},title=${title},path=${path},page=0,size=${size},sort='track',dir=${sort == 'track' and dir == 'asc' ? 'desc' : 'asc'})}">Track <span th:if="${sort == 'track'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
        <th><a th:href="@{/(artist=${artist},album=${album},title=${title},path=${path},page=0,size=${size},sort='currentPath',dir=${sort == 'currentPath' and dir == 'asc' ? 'desc' : 'asc'})}">Current Path <span th:if="${sort == 'currentPath'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
        <th><a th:href="@{/(artist=${artist},album=${album},title=${title},path=${path},page=0,size=${size},sort='originalPath',dir=${sort == 'originalPath' and dir == 'asc' ? 'desc' : 'asc'})}">Original Path <span th:if="${sort == 'originalPath'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
        <th>Extra Metadata</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="record : ${records}">
        <td th:text="${record.id}"></td>
        <td th:text="${record.artist}"></td>
        <td th:text="${record.album}"></td>
        <td th:text="${record.title}"></td>
        <td th:text="${record.track}"></td>
        <td th:text="${record.currentPath}"></td>
        <td th:text="${record.originalPath}"></td>
        <td th:text="${record.extraMetadataJson != null and !record.extraMetadataJson.isBlank() and record.extraMetadataJson != '{}' ? 'Yes' : 'No'}"></td>
        <td><a th:href="@{'/mp3/' + ${record.id}(artist=${artist},album=${album},title=${title},path=${path},page=${page},size=${size},sort=${sort},dir=${dir})}">Edit</a></td>
    </tr>
    </tbody>
</table>
</div>

<div class="pager" th:if="${totalPages > 0}">
    <a th:if="${hasPrevious}" th:href="@{/(artist=${artist},album=${album},title=${title},path=${path},page=${page - 1},size=${size},sort=${sort},dir=${dir})}">Previous</a>
    <span th:text="${'Page ' + (page + 1) + ' of ' + totalPages}"></span>
    <a th:if="${hasNext}" th:href="@{/(artist=${artist},album=${album},title=${title},path=${path},page=${page + 1},size=${size},sort=${sort},dir=${dir})}">Next</a>
</div>
</main>
</body>
</html>
